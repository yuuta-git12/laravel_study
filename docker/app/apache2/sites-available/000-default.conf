# =============================================================================
# Laravelアプリケーション用 Apache仮想ホスト設定
#
# Laravelのpublicディレクトリ（ビルド後はhtml）をDocumentRootとして設定し、
# .htaccessを使わずにApache設定で直接リライトルールを定義する
# =============================================================================

# ドキュメントルート設定（Laravelのpublicディレクトリに対応）
DocumentRoot /var/www/html

<Directory "/var/www/html/">
    # ディレクトリ一覧の表示を無効化（-Indexes）し、シンボリックリンクの追跡を許可（+FollowSymLinks）
    Options -Indexes +FollowSymLinks

    # .htaccessによる設定上書きを無効化（リライトルールはここで直接定義）
    AllowOverride None

    # Laravelのリライトルール（.htaccessの代わり）
    # すべてのリクエストをindex.phpにルーティングし、Laravelのルーターで処理する
    RewriteEngine On
    RewriteCond %{REQUEST_FILENAME} !-d  # リクエストがディレクトリでない場合
    RewriteCond %{REQUEST_FILENAME} !-f  # リクエストがファイルでない場合
    RewriteRule ^ index.php [L]          # index.phpへ転送

    # アクセス制御（すべてのリクエストを許可）
    Require all granted
</Directory>

# vhosts設定の場合
# DocumentRoot "/var/www/vhosts/mycompany.co.jp/httpdocs"